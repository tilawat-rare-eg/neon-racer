<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1026">
<title>قاهرة درايف</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a1026; font-family:'Segoe UI',Tahoma,Arial,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; display:block; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; background:radial-gradient(ellipse at 50% 35%, rgba(80,40,15,.45), rgba(10,6,20,.94) 75%); color:#fff; text-align:center; transition:opacity .4s; }
  .hidden { opacity:0; pointer-events:none; }
  h1 { font-size:clamp(34px,10vw,64px); font-weight:900; background:linear-gradient(180deg,#ffd75e,#ff7a18 55%,#ff2b8a); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 18px rgba(255,122,24,.5)); margin-bottom:8px; }
  .sub { color:#d8c9a8; font-size:15px; margin-bottom:26px; line-height:1.8; padding:0 24px; }
  .btn { font-size:20px; font-weight:800; color:#1a0b02; background:linear-gradient(90deg,#ffd75e,#ff7a18); border:none; border-radius:999px; padding:14px 54px; cursor:pointer; box-shadow:0 0 24px rgba(255,122,24,.55); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.05); box-shadow:0 0 36px rgba(255,122,24,.8);} }
  #hud { position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); left:0; width:100%; display:flex; justify-content:space-between; padding:0 16px; z-index:10; color:#fff; font-weight:800; font-size:18px; text-shadow:0 0 8px rgba(0,0,0,.9); pointer-events:none; direction:ltr; }
  #hud .coin { color:#ffd75e; }
  .ctl { position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); z-index:10; display:flex; gap:14px; }
  .ctl button { width:74px; height:74px; border-radius:50%; border:2px solid rgba(255,215,94,.4); background:rgba(20,16,40,.5); color:#ffd75e; font-size:28px; font-weight:900; backdrop-filter:blur(4px); }
  .ctl button:active { background:rgba(255,215,94,.35); }
  #steer { left:16px; }
  #pedals { right:16px; flex-direction:column; gap:12px; }
  #pedals button { width:66px; height:66px; font-size:22px; }
  #toast { position:fixed; top:20%; width:100%; text-align:center; z-index:15; color:#ffd75e; font-size:26px; font-weight:900; text-shadow:0 0 14px rgba(0,0,0,.9); opacity:0; transition:opacity .5s; pointer-events:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:30; color:#ffd75e; background:#1a1026; font-size:17px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">بنجهز القاهرة... 🌙</div>
<div id="hud" class="hidden"><div id="hudSpeed">0 كم/س</div><div class="coin" id="hudCoins">🪙 0 / 30</div></div>
<div class="ctl hidden" id="steer"><button id="btnL">▶</button><button id="btnR">◀</button></div>
<div class="ctl hidden" id="pedals"><button id="btnG">▲</button><button id="btnB">▼</button></div>
<div id="toast"></div>
<div id="startScreen" class="overlay hidden">
  <h1>قاهرة درايف</h1>
  <div class="sub">سوق براحتك في قاهرة الليل بالـ3D 🌙<br>النيل والزمالك وبرج القاهرة والكباري حواليك<br>لمّ العملات الـ٣٠</div>
  <button class="btn" id="startBtn">يلا نسوق 🚗</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- Renderer / scene ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2a1830, 200, 1400);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 1, 4000);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// dusk sky dome
(function(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0, '#120a2e'); gr.addColorStop(0.55, '#3d1d4e'); gr.addColorStop(0.8, '#a14a3a'); gr.addColorStop(1, '#ff9a5a');
  g.fillStyle = gr; g.fillRect(0,0,4,256);
  const tex = new THREE.CanvasTexture(c);
  const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 16, 12), new THREE.MeshBasicMaterial({map: tex, side: THREE.BackSide, fog: false}));
  scene.add(sky);
})();
scene.add(new THREE.HemisphereLight(0x9a86c8, 0x33241a, 1.0));
const sun = new THREE.DirectionalLight(0xffb36b, 0.9); sun.position.set(-600, 500, -300); scene.add(sun);
const moon = new THREE.DirectionalLight(0x7a86c8, 0.35); moon.position.set(400, 600, 500); scene.add(moon);
// ---------- Map constants ----------
const WORLD = 2600, NILE = {x1:1000, x2:1280}, BRIDGES = [500, 1050, 1600, 2150];
const ISLAND = {x1:1018, x2:1262, y1:780, y2:1360}, TOWER = {x:1140, y:1075};
const ROAD_W = 66, GRID = 320;
function rnd(a,b){ return a + Math.random()*(b-a); }
function inNile(x,y,pad=0){ if(x > NILE.x1-pad && x < NILE.x2+pad){
    if(ISLAND.x1-pad < x && x < ISLAND.x2+pad && ISLAND.y1-pad < y && y < ISLAND.y2+pad) return false;
    for(const by of BRIDGES) if(Math.abs(y-by) < 34+pad) return false;
    return true; } return false; }

// ---------- Textures ----------
function canvasTex(w, h, draw){ const c = document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); return t; }
function buildingTex(base, winCol){
  return canvasTex(128, 256, (g,w,h) => {
    g.fillStyle = base; g.fillRect(0,0,w,h);
    for(let i=0;i<300;i++){ g.fillStyle = 'rgba(0,0,0,'+rnd(.02,.08)+')'; g.fillRect(rnd(0,w), rnd(0,h), rnd(2,8), rnd(2,8)); }
    const cols = 5, rows = 12, ww = w/cols, hh = h/rows;
    for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
      const lit = Math.random() < .38;
      g.fillStyle = lit ? winCol : 'rgba(20,18,30,.85)';
      g.fillRect(i*ww + ww*.22, j*hh + hh*.25, ww*.56, hh*.5);
    }
  });
}
const roadTex = canvasTex(128, 128, (g,w,h) => {
  g.fillStyle = '#2e2c3a'; g.fillRect(0,0,w,h);
  for(let i=0;i<400;i++){ g.fillStyle = 'rgba(255,255,255,'+rnd(.01,.05)+')'; g.fillRect(rnd(0,w), rnd(0,h), 1.5, 1.5); }
  g.fillStyle = '#3a3744'; g.fillRect(0, 0, 6, h); g.fillRect(w-6, 0, 6, h);
  g.fillStyle = '#e8c95e'; g.fillRect(w/2 - 1.5, 8, 3, 44);
});
roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
const groundTex = canvasTex(256, 256, (g,w,h) => {
  g.fillStyle = '#4a4038'; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){ g.fillStyle = 'rgba(' + (Math.random()<.5?'0,0,0':'255,240,220') + ','+rnd(.02,.06)+')'; g.fillRect(rnd(0,w), rnd(0,h), rnd(2,6), rnd(2,6)); }
});
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(40, 40);
const waterTex = canvasTex(128, 256, (g,w,h) => {
  g.fillStyle = '#12395e'; g.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){ g.strokeStyle = 'rgba(150,200,255,'+rnd(.04,.12)+')'; g.lineWidth = rnd(1,2.5);
    g.beginPath(); const y = rnd(0,h); g.moveTo(rnd(-20,w/2), y); g.quadraticCurveTo(w/2, y+rnd(-8,8), rnd(w/2, w+20), y); g.stroke(); }
});
waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;

// ---------- City ----------
const buildings = [];
const facadeTexs = [buildingTex('#b09870', '#ffd28a'), buildingTex('#a08a68', '#ffe0a0'), buildingTex('#8f8296', '#cfe0ff'), buildingTex('#b5a288', '#ffd28a')];
const facadeMats = facadeTexs.map(t => new THREE.MeshLambertMaterial({map: t, emissive: 0xffc270, emissiveMap: t, emissiveIntensity: .45}));
const roofMat = new THREE.MeshLambertMaterial({color: 0x5a4c3c});
const boxGeo = new THREE.BoxGeometry(1,1,1);

function addBuilding(x, y, w, h, d){
  const mats = [facadeMats[Math.floor(rnd(0,4))], facadeMats[Math.floor(rnd(0,4))], roofMat, roofMat, facadeMats[0], facadeMats[1]];
  const m = new THREE.Mesh(boxGeo, mats);
  m.scale.set(w, h, d); m.position.set(x + w/2, h/2, y + d/2);
  scene.add(m);
  buildings.push({x, y, w, h: d});
}
function genCity(){
  for(let bx = GRID; bx < WORLD - GRID + 1; bx += GRID)
    for(let by = GRID; by < WORLD - GRID + 1; by += GRID){
      const x0 = bx - GRID + ROAD_W/2 + 14, y0 = by - GRID + ROAD_W/2 + 14, x1 = bx - ROAD_W/2 - 14, y1 = by - ROAD_W/2 - 14;
      if(x1-x0 < 40 || y1-y0 < 40) continue;
      if(x1 > NILE.x1 - 16 && x0 < NILE.x2 + 16) continue;
      const n = Math.floor(rnd(2,5));
      for(let i=0;i<n;i++){
        const w = rnd(40, Math.min(100, x1-x0)), d = rnd(40, Math.min(100, y1-y0));
        const x = rnd(x0, x1-w), y = rnd(y0, y1-d);
        if(inNile(x + w/2, y + d/2)) continue;
        addBuilding(x, y, w, rnd(35, 130), d);
      }
    }
  // ground
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD+1600, WORLD+1600), new THREE.MeshLambertMaterial({map: groundTex, color: 0x8a7a68}));
  ground.rotation.x = -Math.PI/2; ground.position.set(WORLD/2, -0.5, WORLD/2); scene.add(ground);
  // roads
  const roadMatV = new THREE.MeshLambertMaterial({map: roadTex.clone()});
  for(let gI = GRID; gI < WORLD; gI += GRID){
    const tV = roadTex.clone(); tV.needsUpdate = true; tV.wrapS = tV.wrapT = THREE.RepeatWrapping; tV.repeat.set(1, WORLD/128); tV.rotation = Math.PI/2;
    const rv = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, WORLD), new THREE.MeshLambertMaterial({map: tV}));
    rv.rotation.x = -Math.PI/2; rv.rotation.z = Math.PI/2; rv.position.set(gI, 0.1, WORLD/2); scene.add(rv);
    const tH = roadTex.clone(); tH.needsUpdate = true; tH.wrapS = tH.wrapT = THREE.RepeatWrapping; tH.repeat.set(1, WORLD/128);
    const rh = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, WORLD), new THREE.MeshLambertMaterial({map: tH}));
    rh.rotation.x = -Math.PI/2; rh.position.set(WORLD/2, 0.12, gI); scene.add(rh);
  }
  // Nile
  const wt = waterTex.clone(); wt.needsUpdate = true; wt.wrapS = wt.wrapT = THREE.RepeatWrapping; wt.repeat.set(1, WORLD/256);
  const nile = new THREE.Mesh(new THREE.PlaneGeometry(NILE.x2-NILE.x1, WORLD), new THREE.MeshLambertMaterial({map: wt, color: 0x9ab8d8}));
  nile.rotation.x = -Math.PI/2; nile.position.set((NILE.x1+NILE.x2)/2, 0.05, WORLD/2); scene.add(nile);
  // island
  const isl = new THREE.Mesh(new THREE.BoxGeometry(ISLAND.x2-ISLAND.x1, 3, ISLAND.y2-ISLAND.y1), new THREE.MeshLambertMaterial({color: 0x2e4a2a}));
  isl.position.set((ISLAND.x1+ISLAND.x2)/2, 1.5, (ISLAND.y1+ISLAND.y2)/2); scene.add(isl);
  // bridges
  const bridgeMat = new THREE.MeshLambertMaterial({color: 0x55505e});
  const railMat = new THREE.MeshBasicMaterial({color: 0xffd75e});
  for(const by of BRIDGES){
    const b = new THREE.Mesh(new THREE.BoxGeometry(NILE.x2-NILE.x1+36, 4, 62), bridgeMat);
    b.position.set((NILE.x1+NILE.x2)/2, 2, by); scene.add(b);
    for(const s of [-1,1]){ const rail = new THREE.Mesh(new THREE.BoxGeometry(NILE.x2-NILE.x1+36, 1.5, 1.5), railMat);
      rail.position.set((NILE.x1+NILE.x2)/2, 5, by + s*30); scene.add(rail); }
  }
}
// ---------- Palms, minarets, tower, boats, coins ----------
const trunkMat = new THREE.MeshLambertMaterial({color: 0x6b4e2e});
const frondMat = new THREE.MeshLambertMaterial({color: 0x2e6b34});
function addPalm(x, y){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.6, 22, 5), trunkMat);
  trunk.position.y = 11; g.add(trunk);
  for(let k=0;k<6;k++){ const f = new THREE.Mesh(new THREE.ConeGeometry(1.6, 16, 4), frondMat);
    const an = k * Math.PI/3;
    f.position.set(Math.cos(an)*6, 24, Math.sin(an)*6);
    f.rotation.z = Math.cos(an) * 1.9; f.rotation.x = -Math.sin(an) * 1.9;
    g.add(f); }
  g.position.set(x, 0, y); scene.add(g);
}
const minaretMat = new THREE.MeshLambertMaterial({color: 0xd8c9a8});
const domeMat = new THREE.MeshLambertMaterial({color: 0x2f8b5f});
const tipMat = new THREE.MeshBasicMaterial({color: 0xffd75e});
function addMinaret(x, y){
  const g = new THREE.Group();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(10, 10, 8), domeMat); dome.position.set(-14, 8, 0); g.add(dome);
  const base = new THREE.Mesh(new THREE.BoxGeometry(24, 10, 24), minaretMat); base.position.set(-14, 3, 0); g.add(base);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 3, 60, 8), minaretMat); shaft.position.set(12, 30, 0); g.add(shaft);
  const balc = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 4.5, 3, 8), minaretMat); balc.position.set(12, 48, 0); g.add(balc);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(2.6, 10, 8), tipMat); tip.position.set(12, 65, 0); g.add(tip);
  g.position.set(x, 0, y); scene.add(g);
}
function addTower(){
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(9, 14, 180, 12), new THREE.MeshLambertMaterial({color: 0xc9b184}));
  shaft.position.y = 90; g.add(shaft);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(16, 11, 40, 12), new THREE.MeshLambertMaterial({color: 0xa8906a, emissive: 0x554422, emissiveIntensity:.5}));
  top.position.y = 195; g.add(top);
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(4, 8, 8), new THREE.MeshBasicMaterial({color: 0xff3050}));
  beacon.position.y = 218; g.add(beacon);
  g.position.set(TOWER.x, 0, TOWER.y); scene.add(g);
}
const boats = [];
function addBoats(){
  for(let i=0;i<5;i++){
    const g = new THREE.Group();
    const hull = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 22), new THREE.MeshLambertMaterial({color: 0x8a6b45}));
    hull.position.y = 1.5; g.add(hull);
    const sail = new THREE.Mesh(new THREE.PlaneGeometry(14, 18), new THREE.MeshLambertMaterial({color: 0xf5ecd7, side: THREE.DoubleSide}));
    sail.position.y = 13; g.add(sail);
    g.position.set(rnd(NILE.x1+40, NILE.x2-40), 0, rnd(0, WORLD));
    g.userData.v = rnd(10, 22) * (Math.random()<.5?1:-1);
    g.rotation.y = g.userData.v > 0 ? 0 : Math.PI;
    scene.add(g); boats.push(g);
  }
}
const coins = [];
const coinGeo = new THREE.CylinderGeometry(9, 9, 2.5, 20);
const coinMat = new THREE.MeshLambertMaterial({color: 0xffd75e, emissive: 0xaa7700, emissiveIntensity: .8});
function genCoins(){
  const spots = [];
  for(let i=0;i<24;i++){
    const horiz = Math.random() < .5;
    const gI = GRID * Math.floor(rnd(1, WORLD/GRID - 1));
    const d = rnd(200, WORLD - 200);
    const x = horiz ? d : gI, y = horiz ? gI : d;
    if(!inNile(x, y)) spots.push({x, y});
  }
  spots.push({x: TOWER.x + 70, y: TOWER.y}, {x: NILE.x1 - 120, y: 1050}, {x: NILE.x2 + 120, y: 1600},
    {x: 320, y: 320}, {x: WORLD - 320, y: 320}, {x: WORLD - 320, y: WORLD - 320}, {x: 320, y: WORLD - 320});
  for(const s of spots){
    const m = new THREE.Mesh(coinGeo, coinMat);
    m.rotation.x = Math.PI/2; m.position.set(s.x, 12, s.y);
    scene.add(m);
    coins.push({x: s.x, y: s.y, mesh: m, got: false, spin: Math.random()*6});
  }
}
genCity(); addTower(); addBoats();
for(let y = 60; y < WORLD - 60; y += 90){ addPalm(NILE.x1 - 24 + rnd(-5,5), y + rnd(-10,10)); addPalm(NILE.x2 + 24 + rnd(-5,5), y + rnd(-10,10)); }
for(let x = ISLAND.x1 + 20; x < ISLAND.x2 - 10; x += 60){ addPalm(x, ISLAND.y1 + 14); addPalm(x, ISLAND.y2 - 14); }
for(let i=0;i<14;i++){ const x = rnd(200, WORLD-200), y = rnd(200, WORLD-200); if(!inNile(x, y)) addMinaret(x, y); }
genCoins();
// ---------- Car ----------
const car = { x: 320, y: 480, a: 0, v: 0, maxV: 340 };
const input = { gas:false, brake:false, left:false, right:false };
let running = false, coinsGot = 0, toastT = 0;
const carG = new THREE.Group();
(function(){
  const bodyMat = new THREE.MeshLambertMaterial({color: 0xc2184f, emissive: 0x550a20, emissiveIntensity:.4});
  const glassMat = new THREE.MeshLambertMaterial({color: 0x18243a});
  const body = new THREE.Mesh(new THREE.BoxGeometry(16, 6, 34), bodyMat); body.position.y = 5; carG.add(body);
  const hood = new THREE.Mesh(new THREE.BoxGeometry(15, 3.4, 10), bodyMat); hood.position.set(0, 4.4, -19); carG.add(hood);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(13, 5, 16), glassMat); cabin.position.set(0, 9.5, 2); carG.add(cabin);
  const wheelG = new THREE.CylinderGeometry(3.2, 3.2, 2.4, 10);
  const wheelM = new THREE.MeshLambertMaterial({color: 0x0a0a0e});
  [[-8,-12],[8,-12],[-8,12],[8,12]].forEach(p => { const w = new THREE.Mesh(wheelG, wheelM);
    w.rotation.z = Math.PI/2; w.position.set(p[0], 3.2, p[1]); carG.add(w); });
  const hlM = new THREE.MeshBasicMaterial({color: 0xfff2c0});
  [-5,5].forEach(x => { const hl = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.6, 1), hlM); hl.position.set(x, 5, -24.2); carG.add(hl); });
  const tlM = new THREE.MeshBasicMaterial({color: 0xff3050});
  const tl = new THREE.Mesh(new THREE.BoxGeometry(13, 1.6, 1), tlM); tl.position.set(0, 5, 17.2); carG.add(tl);
  carG.userData.brakeLight = tl;
  // headlight glow cone
  const cone = new THREE.Mesh(new THREE.ConeGeometry(26, 90, 12, 1, true),
    new THREE.MeshBasicMaterial({color: 0xfff2c0, transparent: true, opacity: .10, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false}));
  cone.rotation.x = -Math.PI/2; cone.position.set(0, 3, -68); carG.add(cone);
  // ground blob
  const blob = new THREE.Mesh(new THREE.CircleGeometry(20, 16), new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: .35, depthWrite: false}));
  blob.rotation.x = -Math.PI/2; blob.position.y = 0.15; carG.add(blob);
})();
scene.add(carG);

function collide(nx, ny){
  if(nx < 24 || ny < 24 || nx > WORLD-24 || ny > WORLD-24) return true;
  if(inNile(nx, ny, 10)) return true;
  const r = 12;
  for(const b of buildings) if(nx > b.x-r && nx < b.x+b.w+r && ny > b.y-r && ny < b.y+b.h+r) return true;
  return false;
}
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.style.opacity = 1; toastT = 1.6; }
function physics(dt){
  if(input.gas) car.v += 260*dt;
  else if(input.brake){ if(car.v > 5) car.v -= 340*dt; else car.v = Math.max(car.v - 130*dt, -110); }
  else car.v -= car.v * 0.7 * dt;
  car.v = Math.max(-110, Math.min(car.maxV, car.v));
  const steer = (input.left ? -1 : 0) + (input.right ? 1 : 0);
  if(steer && Math.abs(car.v) > 2){
    const sf = Math.min(1, Math.abs(car.v)/120) * Math.sign(car.v);
    car.a += steer * 2.2 * sf * dt;
  }
  const nx = car.x + Math.cos(car.a) * car.v * dt;
  const ny = car.y + Math.sin(car.a) * car.v * dt;
  if(!collide(nx, car.y)) car.x = nx; else car.v *= -0.25;
  if(!collide(car.x, ny)) car.y = ny; else car.v *= -0.25;
  carG.position.set(car.x, 0, car.y);
  carG.rotation.y = -car.a + Math.PI/2;
  carG.userData.brakeLight.material.color.setHex(input.brake ? 0xff7080 : 0xff3050);
  for(const c of coins){ if(!c.got && Math.hypot(c.x-car.x, c.y-car.y) < 26){ c.got = true; scene.remove(c.mesh); coinsGot++;
    toast(coinsGot >= 30 ? 'جمعتهم كلهم! بطل 🏆' : ['برج القاهرة! 🗼','عاش يا وحش 🔥','جامد!','يلا بينا 🚗','برافو عليك ⭐'][Math.floor(Math.random()*5)]);
    if(navigator.vibrate) navigator.vibrate(40); } }
  document.getElementById('hudSpeed').textContent = Math.round(Math.abs(car.v)*0.55) + ' كم/س';
  document.getElementById('hudCoins').textContent = '🪙 ' + coinsGot + ' / 30';
}
const camPos = new THREE.Vector3(), camTarget = new THREE.Vector3();
function updateCamera(dt){
  const fx = Math.cos(car.a), fz = Math.sin(car.a);
  camPos.set(car.x - fx*92, 44, car.y - fz*92);
  camera.position.lerp(camPos, Math.min(1, dt*4));
  camTarget.set(car.x + fx*70, 6, car.y + fz*70);
  camera.lookAt(camTarget);
}
let lastT = 0;
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t-lastT)/1000 || 0); lastT = t;
  if(running) physics(dt);
  if(toastT > 0){ toastT -= dt; if(toastT <= 0) document.getElementById('toast').style.opacity = 0; }
  for(const b of boats){ b.position.z += b.userData.v * dt; if(b.position.z < -40) b.position.z = WORLD+40; if(b.position.z > WORLD+40) b.position.z = -40; }
  for(const c of coins) if(!c.got){ c.mesh.rotation.z = t*0.002 + c.spin; c.mesh.position.y = 12 + Math.sin(t*0.003 + c.spin)*2.5; }
  updateCamera(dt);
  renderer.render(scene, camera);
}
// ---------- Input / start ----------
function bindHold(id, key){ const el = document.getElementById(id);
  const on = e => { e.preventDefault(); input[key] = true; };
  const off = e => { e.preventDefault(); input[key] = false; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off); }
bindHold('btnG','gas'); bindHold('btnB','brake'); bindHold('btnL','left'); bindHold('btnR','right');
addEventListener('keydown', e => {
  if(e.key==='ArrowUp') input.gas = true; if(e.key==='ArrowDown') input.brake = true;
  if(e.key==='ArrowLeft') input.left = true; if(e.key==='ArrowRight') input.right = true;
  if((e.key===' '||e.key==='Enter') && !running) start(); });
addEventListener('keyup', e => {
  if(e.key==='ArrowUp') input.gas = false; if(e.key==='ArrowDown') input.brake = false;
  if(e.key==='ArrowLeft') input.left = false; if(e.key==='ArrowRight') input.right = false; });
function start(){
  running = true;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('steer').classList.remove('hidden');
  document.getElementById('pedals').classList.remove('hidden');
  toast('اتحرك بحرية.. روح شوف برج القاهرة 🗼');
}
document.getElementById('startBtn').onclick = start;
carG.position.set(car.x, 0, car.y);
camera.position.set(car.x - 92, 44, car.y);
document.getElementById('loading').classList.add('hidden');
document.getElementById('startScreen').classList.remove('hidden');
requestAnimationFrame(loop);
</script>
