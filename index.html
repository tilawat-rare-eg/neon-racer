<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070312">
<title>سباق النيون</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#070312; font-family:'Segoe UI',Tahoma,Arial,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; display:block; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; background:radial-gradient(ellipse at 50% 30%, rgba(60,10,90,.55), rgba(4,2,12,.92) 75%); color:#fff; text-align:center; transition:opacity .4s; }
  .hidden { opacity:0; pointer-events:none; }
  h1 { font-size:clamp(34px,9vw,64px); font-weight:900; letter-spacing:1px; background:linear-gradient(180deg,#7df9ff,#ff2bd6 60%,#ff7a18); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 18px rgba(255,43,214,.55)); margin-bottom:6px; }
  .sub { color:#b9a8e6; font-size:15px; margin-bottom:28px; }
  .btn { font-size:20px; font-weight:800; color:#0b0214; background:linear-gradient(90deg,#7df9ff,#ff2bd6); border:none; border-radius:999px; padding:14px 54px; cursor:pointer; box-shadow:0 0 24px rgba(255,43,214,.6), 0 0 60px rgba(125,249,255,.25); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.05); box-shadow:0 0 34px rgba(255,43,214,.85), 0 0 80px rgba(125,249,255,.35);} }
  .score-big { font-size:clamp(48px,14vw,90px); font-weight:900; color:#7df9ff; text-shadow:0 0 22px rgba(125,249,255,.7); }
  .stat { color:#cfc3f2; font-size:17px; margin:4px 0; }
  .hint { position:fixed; bottom:14px; width:100%; text-align:center; color:rgba(255,255,255,.5); font-size:12px; z-index:5; }
  #hud { position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); left:0; width:100%; display:flex; justify-content:space-between; padding:0 16px; z-index:5; color:#fff; font-weight:800; font-size:17px; text-shadow:0 0 8px rgba(0,0,0,.8); pointer-events:none; direction:ltr; }
  #hud .coin { color:#ffd75e; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div id="hudSpeed">0 كم/س</div><div class="coin" id="hudCoins">🪙 0</div><div id="hudScore">0</div></div>
<div id="startScreen" class="overlay">
  <h1>سباق النيون</h1>
  <div class="sub">تفادى العربيات ولمّ العملات.. اسحب صوابعك يمين وشمال</div>
  <button class="btn" id="startBtn">يلا نلعب 🏎️</button>
  <div class="sub" style="margin-top:18px;font-size:12px" id="bestStart"></div>
</div>
<div id="overScreen" class="overlay hidden">
  <h1 style="font-size:clamp(28px,8vw,48px)">خبطت! 💥</h1>
  <div class="score-big" id="finalScore">0</div>
  <div class="stat" id="finalCoins"></div>
  <div class="stat" id="finalBest"></div>
  <button class="btn" id="againBtn" style="margin-top:22px">العب تاني</button>
</div>
<div class="hint">اسحب شمال ويمين • أو استخدم أسهم الكيبورد</div>
<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){ DPR = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); buildSky(); }
addEventListener('resize', resize);

// ---------- World ----------
const LANES = 4;
const state = { running:false, speed:0, maxSpeed:240, dist:0, score:0, coins:0, best:+(localStorage.getItem('neonBest')||0), shake:0, flash:0 };
const player = { x:0.5, w:0.105, lean:0, targetX:0.5 };
let traffic = [], coins = [], parts = [], stars = [], skyline = [], roadOff = 0, spawnT = 0, coinT = 0, lastT = 0;

function buildSky(){
  stars = []; for(let i=0;i<120;i++) stars.push({x:Math.random()*W, y:Math.random()*H*0.42, r:Math.random()*1.4+0.3, tw:Math.random()*Math.PI*2});
  skyline = [];
  const layers = [{y:H*0.34, col:'#150a2e', min:30, max:90, par:0.15},{y:H*0.38, col:'#0d0620', min:50, max:130, par:0.35}];
  for(const L of layers){ let x=0; const row=[]; while(x < W+120){ const w = 30+Math.random()*70, h = L.min+Math.random()*(L.max-L.min); row.push({x, w, h, lit:Math.random()<.5? Math.floor(2+Math.random()*5):0}); x += w + 4+Math.random()*14; } skyline.push({...L, row, off:0}); }
}
function roadWidth(y){ const t = y/H; return W*0.14 + W*0.9*t*t; }         // perspective road width
function roadX(y){ return W/2; }                                        // center
function laneToX(frac, y){ const rw = roadWidth(y); return roadX(y) - rw/2 + rw*frac; }

// ---------- Drawing ----------
function drawSky(t){
  const g = ctx.createLinearGradient(0,0,0,H*0.45);
  g.addColorStop(0,'#05010f'); g.addColorStop(.6,'#170b38'); g.addColorStop(1,'#3d1054');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H*0.45);
  // sun/moon
  ctx.save(); ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=60;
  const sg = ctx.createLinearGradient(0,H*0.1,0,H*0.42); sg.addColorStop(0,'#ffd75e'); sg.addColorStop(1,'#ff2bd6');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(W/2, H*0.30, Math.min(W,H)*0.14, 0, Math.PI*2); ctx.fill(); ctx.restore();
  for(const s of stars){ const a = 0.4+0.6*Math.abs(Math.sin(t*0.001+s.tw)); ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fillRect(s.x,s.y,s.r,s.r); }
  for(const L of skyline){ ctx.fillStyle=L.col; const ox = (L.off % (W+120) + W+120) % (W+120);
    for(const b of L.row){ const bx = b.x - ox; if(bx > W || bx + b.w < 0) continue;
      ctx.fillRect(bx, L.y - b.h, b.w, b.h + 40);
      if(b.lit){ ctx.fillStyle='rgba(255,215,94,.75)'; for(let i=0;i<b.lit;i++){ ctx.fillRect(bx+5+ (i*13)% (b.w-10), L.y-b.h+8+((i*29)%(Math.max(10,b.h-16))), 4, 6);} ctx.fillStyle=L.col; }
    }
  }
  // horizon glow
  const hg = ctx.createLinearGradient(0,H*0.36,0,H*0.46); hg.addColorStop(0,'rgba(255,43,214,0)'); hg.addColorStop(1,'rgba(255,43,214,.35)');
  ctx.fillStyle=hg; ctx.fillRect(0,H*0.36,W,H*0.1);
}
function drawRoad(t){
  const top = H*0.42;
  // ground
  const gg = ctx.createLinearGradient(0,top,0,H); gg.addColorStop(0,'#12082b'); gg.addColorStop(1,'#070312');
  ctx.fillStyle=gg; ctx.fillRect(0,top,W,H-top);
  // asphalt
  ctx.beginPath(); ctx.moveTo(roadX(top)-roadWidth(top)/2, top); ctx.lineTo(roadX(top)+roadWidth(top)/2, top);
  ctx.lineTo(roadX(H)+roadWidth(H)/2, H); ctx.lineTo(roadX(H)-roadWidth(H)/2, H); ctx.closePath();
  const ag = ctx.createLinearGradient(0,top,0,H); ag.addColorStop(0,'#1c1440'); ag.addColorStop(1,'#241a4d');
  ctx.fillStyle=ag; ctx.fill();
  // edge glow strips
  for(const side of [-1,1]){ ctx.beginPath();
    ctx.moveTo(roadX(top)+side*roadWidth(top)/2, top);
    ctx.lineTo(roadX(H)+side*roadWidth(H)/2, H);
    ctx.strokeStyle='#ff2bd6'; ctx.lineWidth=3; ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=12; ctx.stroke(); ctx.shadowBlur=0; }
  // dashes
  ctx.lineCap='round';
  for(let l=1;l<LANES;l++){ const f = l/LANES;
    const segLen = 0.05, gap = 0.05, cycle = segLen+gap;
    for(let d=0; d<1; d+=cycle){ let s=(d+roadOff)%1; let e=s+segLen; if(e>1) e=1; if(s>=1) continue;
      const y1 = top + s*s*(H-top), y2 = top + e*e*(H-top);
      ctx.beginPath(); ctx.moveTo(laneToX(f,y1), y1); ctx.lineTo(laneToX(f,y2), y2);
      ctx.strokeStyle='rgba(125,249,255,.5)'; ctx.lineWidth=1+6*s*s; ctx.stroke(); }
  }
}
function drawCar(x, y, w, h, body, opts={}){
  ctx.save(); ctx.translate(x,y); if(opts.lean) ctx.rotate(opts.lean*0.08);
  const r = w*0.22;
  ctx.shadowColor = opts.glow || body; ctx.shadowBlur = 18;
  // body
  const g = ctx.createLinearGradient(0,-h/2,0,h/2); g.addColorStop(0, opts.light||'#ffffff'); g.addColorStop(.25, body); g.addColorStop(1, opts.dark||'#000');
  ctx.fillStyle = g;
  roundRect(-w/2, -h/2, w, h, r); ctx.fill();
  ctx.shadowBlur = 0;
  // cabin
  ctx.fillStyle = 'rgba(10,15,35,.9)';
  roundRect(-w*0.36, -h*0.22, w*0.72, h*0.34, w*0.14); ctx.fill();
  // windshield glint
  ctx.fillStyle = 'rgba(125,249,255,.35)';
  roundRect(-w*0.32, -h*0.2, w*0.64, h*0.08, w*0.1); ctx.fill();
  // spoiler
  ctx.fillStyle = opts.dark||'#000'; roundRect(-w*0.48, h*0.32, w*0.96, h*0.08, 4); ctx.fill();
  // wheels
  ctx.fillStyle='#05050a';
  [[-w*0.52,-h*0.3],[w*0.52,-h*0.3],[-w*0.52,h*0.26],[w*0.52,h*0.26]].forEach(p=>{ roundRect(p[0]-w*0.07, p[1]-h*0.09, w*0.14, h*0.18, 4); ctx.fill(); });
  // lights
  if(opts.lights !== false){ ctx.shadowBlur=14;
    ctx.shadowColor = opts.rear ? '#ff3050' : '#fff8c8';
    ctx.fillStyle = opts.rear ? '#ff3050' : '#fff8c8';
    roundRect(-w*0.38, -h*0.5+2, w*0.18, h*0.05, 3); ctx.fill();
    roundRect(w*0.2, -h*0.5+2, w*0.18, h*0.05, 3); ctx.fill();
    ctx.shadowBlur=0; }
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawCoin(c){
  const y = H*0.42 + c.z*c.z*(H-H*0.42);
  const x = laneToX(c.f, y);
  const s = (8 + 26*c.z*c.z) * (0.75+0.25*Math.abs(Math.sin(performance.now()*0.006 + c.spin)));
  ctx.save(); ctx.translate(x,y); ctx.shadowColor='#ffd75e'; ctx.shadowBlur=16;
  ctx.fillStyle='#ffd75e'; ctx.beginPath(); ctx.ellipse(0,0,s,s*0.95,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle='#c98a12'; ctx.font=`bold ${Math.max(8,s)}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('£',0,1);
  ctx.restore();
}
function drawTrafficCar(c){
  const y = H*0.42 + c.z*c.z*(H-H*0.42);
  const x = laneToX(c.f, y);
  const w = roadWidth(y)*player.w*0.95;
  drawCar(x, y, w, w*1.9, c.col, {light:c.light, dark:c.dark, glow:c.col, rear:true});
  c.sx = x; c.sy = y; c.sw = w;
}

// ---------- Game logic ----------
const palettes = [
  {col:'#ff4757', light:'#ff8a95', dark:'#7a0d18'},
  {col:'#3b82f6', light:'#93c5fd', dark:'#123a8a'},
  {col:'#22c55e', light:'#86efac', dark:'#0d5c28'},
  {col:'#f59e0b', light:'#fde68a', dark:'#8a5106'},
  {col:'#a855f7', light:'#d8b4fe', dark:'#58128f'}];
function spawnCar(){
  const used = traffic.filter(c=>c.z<0.35).map(c=>c.lane);
  const free = [0,1,2,3].filter(l=>!used.includes(l));
  if(!free.length) return;
  const lane = free[Math.floor(Math.random()*free.length)];
  const p = palettes[Math.floor(Math.random()*palettes.length)];
  traffic.push({lane, f:(lane+0.5)/LANES, z:0, v:0.35+Math.random()*0.2, ...p, sx:0, sy:0, sw:0});
}
function spawnCoinRow(){
  const lane = Math.floor(Math.random()*LANES);
  for(let i=0;i<4;i++) coins.push({f:(lane+0.5)/LANES, z:-i*0.07, spin:Math.random()*6});
}
function burst(x,y,color,n=26){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=2+Math.random()*7; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,life:1,color,sz:2+Math.random()*4}); } }

function update(dt){
  if(!state.running) return;
  state.speed = Math.min(state.maxSpeed, state.speed + dt*6);
  const spd = state.speed/state.maxSpeed;
  roadOff = (roadOff + dt*spd*0.9) % 1;
  state.dist += spd*dt; state.score += spd*dt*10;
  for(const L of skyline) L.off += spd*dt*60*L.par*60*0.016;
  spawnT -= dt; if(spawnT<=0){ spawnCar(); spawnT = Math.max(0.45, 1.5 - spd*1.1) * (0.7+Math.random()*0.6); }
  coinT -= dt; if(coinT<=0){ spawnCoinRow(); coinT = 2.5+Math.random()*3; }
  player.x += (player.targetX - player.x) * Math.min(1, dt*10);
  player.lean += ((player.targetX - player.x)*4 - player.lean) * Math.min(1, dt*12);
  // engine exhaust
  if(Math.random()<spd*0.9){ const py=H*0.88, pw=roadWidth(py)*player.w; parts.push({x:laneToX(player.x,py)+(Math.random()-.5)*pw*0.4, y:py+pw*0.95, vx:(Math.random()-.5)*1, vy:2+Math.random()*2, life:.5, color:'#7df9ff', sz:1.5+Math.random()*2}); }
  const py = H*0.88, pw = roadWidth(py)*player.w, px = laneToX(player.x, py);
  for(const c of traffic){ c.z += dt*spd*0.85*(1-c.v*0.55);
    if(c.z>1.15) { traffic.splice(traffic.indexOf(c),1); state.score+=25; continue; }
    const y = H*0.42 + c.z*c.z*(H-H*0.42), x = laneToX(c.f,y), w = roadWidth(y)*player.w*0.95;
    if(c.z>0.72 && Math.abs(y-py)< (w*1.9 + pw*1.9)*0.42 && Math.abs(x-px) < (w+pw)*0.42){
      crash(px, py); return; } }
  for(const cn of coins){ cn.z += dt*spd*0.85;
    if(cn.z>1.15){ coins.splice(coins.indexOf(cn),1); continue; }
    const y = H*0.42 + cn.z*cn.z*(H-H*0.42), x = laneToX(cn.f,y);
    if(Math.abs(y-py) < pw*1.2 && Math.abs(x-px) < pw*0.8){
      coins.splice(coins.indexOf(cn),1); state.coins++; state.score+=50;
      burst(x,y,'#ffd75e',10); } }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=dt*1.6; if(p.life<=0) parts.splice(i,1); }
  state.shake = Math.max(0, state.shake - dt*3); state.flash = Math.max(0, state.flash - dt*2);
  hud();
}
function crash(x,y){
  state.running = false; state.shake = 1; state.flash = 1;
  burst(x,y,'#ff4757',40); burst(x,y,'#ffd75e',20); burst(x,y,'#7df9ff',20);
  if(navigator.vibrate) navigator.vibrate(200);
  const sc = Math.floor(state.score);
  if(sc > state.best){ state.best = sc; localStorage.setItem('neonBest', sc); }
  setTimeout(()=>{ document.getElementById('finalScore').textContent = sc;
    document.getElementById('finalCoins').textContent = '🪙 عملات: ' + state.coins;
    document.getElementById('finalBest').textContent = '🏆 أفضل نتيجة: ' + state.best;
    document.getElementById('overScreen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden'); }, 700);
}
function draw(t){
  ctx.save();
  if(state.shake>0) ctx.translate((Math.random()-.5)*state.shake*22, (Math.random()-.5)*state.shake*22);
  drawSky(t); drawRoad(t);
  const sorted = [...traffic].sort((a,b)=>a.z-b.z);
  for(const c of sorted) drawTrafficCar(c);
  for(const cn of coins) drawCoin(cn);
  // player
  const py = H*0.88, pw = roadWidth(py)*player.w, px = laneToX(player.x, py);
  if(state.running || state.flash>0.3){
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=10; ctx.fillStyle='rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(px, py+pw*0.9, pw*0.55, pw*0.18, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
    // headlight beams
    const bg = ctx.createLinearGradient(0,py,0,py-H*0.25); bg.addColorStop(0,'rgba(255,248,200,.22)'); bg.addColorStop(1,'rgba(255,248,200,0)');
    ctx.fillStyle=bg; ctx.beginPath(); ctx.moveTo(px-pw*0.3,py-pw*0.9); ctx.lineTo(px-pw*0.8,py-H*0.25); ctx.lineTo(px+pw*0.8,py-H*0.25); ctx.lineTo(px+pw*0.3,py-pw*0.9); ctx.closePath(); ctx.fill();
    drawCar(px, py, pw, pw*1.9, '#ff2bd6', {light:'#ff9df0', dark:'#6e0960', glow:'#ff2bd6', lean:player.lean});
  }
  for(const p of parts){ ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.life+0.5,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
  if(state.flash>0){ ctx.fillStyle=`rgba(255,60,80,${state.flash*0.35})`; ctx.fillRect(-30,-30,W+60,H+60); }
  ctx.restore();
  // vignette
  const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}
function loop(t){ const dt = Math.min(0.05,(t-lastT)/1000||0); lastT = t; update(dt); draw(t); requestAnimationFrame(loop); }

// ---------- HUD / input ----------
const hudScore=document.getElementById('hudScore'), hudCoins=document.getElementById('hudCoins'), hudSpeed=document.getElementById('hudSpeed');
function hud(){ hudScore.textContent=Math.floor(state.score); hudCoins.textContent='🪙 '+state.coins; hudSpeed.textContent=Math.floor(state.speed)+' كم/س'; }
function start(){
  traffic=[]; coins=[]; parts=[]; spawnT=1; coinT=2;
  state.running=true; state.speed=80; state.score=0; state.coins=0; state.dist=0;
  player.x=player.targetX=0.5; player.lean=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
}
document.getElementById('startBtn').onclick = start;
document.getElementById('againBtn').onclick = start;
if(state.best>0) document.getElementById('bestStart').textContent = '🏆 أفضل نتيجة: ' + state.best;
let dragging=false, dragX=0, startTarget=0;
function pt(e){ return e.touches? e.touches[0].clientX : e.clientX; }
addEventListener('pointerdown', e=>{ dragging=true; dragX=e.clientX; startTarget=player.targetX; });
addEventListener('pointermove', e=>{ if(!dragging) return; player.targetX = Math.max(0.06, Math.min(0.94, startTarget + (e.clientX-dragX)/(W*0.55))); });
addEventListener('pointerup', ()=> dragging=false);
addEventListener('pointercancel', ()=> dragging=false);
addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') player.targetX = Math.max(0.06, player.targetX-1/LANES);
  if(e.key==='ArrowRight') player.targetX = Math.min(0.94, player.targetX+1/LANES);
  if((e.key===' '||e.key==='Enter') && !state.running) start(); });
resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
